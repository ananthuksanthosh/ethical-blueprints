name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Show build output
        run: |
          echo "================================"
          echo "ROOT DIRECTORY"
          echo "================================"
          ls -la

          echo ""
          echo "================================"
          echo "DIST DIRECTORY"
          echo "================================"
          if [ -d "dist" ]; then
            find dist -maxdepth 3 -type f | head -100
          else
            echo "dist directory does not exist"
          fi

          echo ""
          echo "================================"
          echo ".OUTPUT DIRECTORY"
          echo "================================"
          if [ -d ".output" ]; then
            find .output -maxdepth 3 -type f | head -100
          else
            echo ".output directory does not exist"
          fi

          echo ""
          echo "================================"
          echo "DIST/CLIENT DIRECTORY"
          echo "================================"
          if [ -d "dist/client" ]; then
            find dist/client -maxdepth 3 -type f | head -100
          else
            echo "dist/client directory does not exist"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/client

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
